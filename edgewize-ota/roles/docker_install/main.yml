---
- name: Deploy docker 23.0.6
  hosts: all
  gather_facts: true
  become: true
  become_method: sudo
  become_user: root
  tasks:
    - name: set arch value
      set_fact:
        arch: x86_64
      when: ansible_architecture == 'x86_64'

    - name: Task for arm64 architecture
      set_fact:
        arch: arm64
      when: ansible_architecture == 'aarch64'

    - name: Copy shell file
      copy:
        src: "files/"
        dest: "/tmp/docker/"
        owner: root
        group: root
        mode: '0755'
    
    - name: download docker file
      get_url:
        url: "https://download.docker.com/linux/static/stable/{{ arch }}/docker-{{ version }}.tgz"
        dest: /tmp/docker/docker-{{ version }}.tgz
        mode: 0644
        force: yes
        validate_certs: no
  
    - name: 执行docker安装的shell脚本
      shell: /tmp/docker/install.sh -f /tmp/docker/docker-{{ version }}.tgz
      args:
        chdir: /tmp/docker